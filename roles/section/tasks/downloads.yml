---
# downloads entries — fetch `url`, verify `sha256`, then run `install` with
# $FILE = the downloaded path: in order, stopping at the first failure, in a bash
# LOGIN shell as you. The download is skipped when the file already matches;
# install re-runs only when the sha256 or the commands change.
- name: "[{{ section_name }}] downloads: fetch + install"
  become: true
  become_user: "{{ device_user }}"
  vars:
    _home: "/home/{{ device_user }}"
    _cache: "/home/{{ device_user }}/.cache/cyberdeck/downloads"
    _state: "/home/{{ device_user }}/.local/state/cyberdeck/installed"
    _nl: "\n"
  block:
    - name: "[{{ section_name }}] downloads: check each entry (name + url + sha256 + install)"
      ansible.builtin.assert:
        that:
          - item.name is defined
          - item.url is defined
          - item.sha256 is defined
          - item.sha256 is match('^[0-9a-fA-F]{64}$')
          - item.install is defined
        fail_msg: "downloads entries need `name`, `url`, a 64-hex `sha256`, and `install`. See docs/software.md."
      loop: "{{ _sec_downloads }}"
      loop_control:
        label: "{{ item.name | default(item.url) | default('?') }}"

    - name: "[{{ section_name }}] downloads: cache dir + ~/.local/bin"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ _cache }}"
        - "{{ _home }}/.local/bin"

    - name: "[{{ section_name }}] downloads: fetch (verified against sha256)"
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ _cache }}/{{ item.url | urlsplit('path') | basename }}"
        checksum: "sha256:{{ item.sha256 }}"
        mode: "0644"
      loop: "{{ _sec_downloads }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "[{{ section_name }}] downloads: install (in order, stop at first failure)"
      ansible.builtin.shell:
        executable: /bin/bash
        chdir: "{{ _cache }}"
        cmd: |
          set -e
          key="{{ item.sha256 }} {{ item.install | to_json | hash('sha1') }}"
          marker="{{ _state }}/download-{{ item.name }}"
          if [ -f "$marker" ] && [ "$(cat "$marker")" = "$key" ]; then exit 0; fi
          bash -lc {{ (['set -ex'] + item.install) | join(_nl) | quote }}   # -x: a failure shows each command run
          mkdir -p "{{ _state }}" && printf '%s' "$key" > "$marker"
          echo __CYBERDECK_INSTALLED__
      environment:
        FILE: "{{ _cache }}/{{ item.url | urlsplit('path') | basename }}"
      loop: "{{ _sec_downloads }}"
      loop_control:
        label: "{{ item.name }}"
      register: _dl_install
      changed_when: "'__CYBERDECK_INSTALLED__' in _dl_install.stdout"
