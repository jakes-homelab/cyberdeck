---
# tooling — the terminal itself: zsh, tmux, git, stow, plus any opt-in extras.
# Kept light by constraint (SPEC §6: 512 MB shared with the framebuffer).

- name: Install the CLI tooling set
  ansible.builtin.apt:
    name: "{{ tooling_packages + tooling_extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Make zsh the login shell for the device user
  ansible.builtin.user:
    name: "{{ device_user }}"
    shell: /usr/bin/zsh
