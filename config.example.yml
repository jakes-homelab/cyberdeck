# cyberdeck — environment inputs. Copy to config.yml and fill in.
#
#   cp config.example.yml config.yml && $EDITOR config.yml
#
# config.yml is gitignored and NEVER committed. Nothing environment-specific
# belongs in this committed example — real values live only in your config.yml.
#
# SECRETS: real WiFi PSKs and personal tokens go ONLY in your gitignored
# config.yml. They are injected onto the device at provision time and never enter
# the repo (no secret in tracked files or history — see docs/secrets-posture.md).
# If you want config.yml encrypted at rest on your own machine, use your personal
# vault (age / pass / SOPS) — the project itself stays agnostic and depends on none.
#
# Each section is tagged with the increment that consumes it. Sections for later
# increments are here so the shape is grounded now; fill what applies to you.

# --- Device identity (I1) ------------------------------------------------------
device:
  user: deck
  host: "CHANGE_ME"                 # deck IP, or a resolvable name (e.g. cyberdeck.local via mDNS) — a bare hostname won't resolve
  ssh_private_key: ""               # PRIVATE key Ansible connects with (e.g. ~/.ssh/id_ed25519) — NOT the .pub; empty => agent/default
  timezone: "Etc/UTC"
  locale: "en_US.UTF-8"
  profile: picocalc-pizero2w        # names profiles/<profile>.yml

# --- WiFi networks (I2) --------------------------------------------------------
# A LIST, so a freshly-flashed deck reconnects to your known networks unattended.
# Higher priority wins when several are in range. PSKs are secrets.
# Each network is DHCP by default; add an optional `static` block to pin an
# address on that network.
wifi:
  - ssid: "YOUR_HOME_WIFI"
    psk: "changeme"
    priority: 100
    static:                              # OPTIONAL — omit the whole block for DHCP
      address: "192.0.2.50/24"           # RFC 5737 documentation range — replace
      gateway: "192.0.2.1"
      dns: ["1.1.1.1", "9.9.9.9"]
  - { ssid: "YOUR_PHONE_HOTSPOT", psk: "changeme", priority: 50 }   # DHCP

# --- SSH (I1 authorized_keys / I4 device identities) ---------------------------
ssh:
  # PUBLIC keys allowed to log IN to the deck. Each entry is either a key STRING
  # or a PATH to a .pub on your machine (e.g. ~/.ssh/id_ed25519.pub), read at run
  # time. Not secret.
  authorized_keys:
    - "ssh-ed25519 AAAA...your-laptop-key... you@example"   # replace — or use a path like ~/.ssh/id_ed25519.pub
  # Keypairs COPIED onto the deck so it can authenticate OUT (your infra / Gitea /
  # GitHub). You provide them — generate on whatever box already distributes your
  # keys (e.g. the Terraform machine) and point here; Ansible copies them to the
  # deck (private key 0600). The private key is a SECRET: paths reference material
  # on the provisioning machine, never committed. No on-device generation — you
  # decide which keys get copied. (A dedicated key is nicer for revocation, but
  # your call; pair it with a passphrase for at-rest protection.)
  identity_keys:
    - name: cyberdeck
      private: "~/.config/cyberdeck/keys/id_ed25519"       # on the provisioning machine
      public:  "~/.config/cyberdeck/keys/id_ed25519.pub"

# --- Python toolchain ----------------------------------------------------------
# uv installs each version ONCE (no rebuilding the common ones on every restore).
# `default` is the one `python` runs and the default env is built on. Disk is cheap
# on a 16 GB+ card — the 512 MB ceiling is a RUNTIME budget, not an install-size one.
# Both workflows work: `uv venv` / `uv run`, or classic `python3.10 -m venv .venv`.
# Empty `versions` => no Python toolchain at all.
python:
  versions:
    - "3.8"
    - "3.10"
    - "3.13"
  default: "3.13"           # must be one of versions
  pip:                      # the DEFAULT env (~/.venvs/base, always on PATH)
    - rich                  # pretty terminal output
    - textual               # build TUIs (same author as rich)

# --- Credentials (I5) — the deck's own DEV IDENTITY (revocable) ----------------
# Written to ~/.config/cyberdeck/env (0600) and sourced by the shell. These are
# the deck's OWN scoped, revocable creds — it acts as your own dev identity
# (clone projects, push to forks, open PRs). They are NOT the homelab's
# owner/admin/infra credentials or SOPS key — those never go on a device that
# leaves the house (docs/secrets-posture.md). Prefer the SSH keys you provide
# (ssh.identity_keys) for git; the tokens here are for CLI/API (gh / tea).
creds:
  github_token: ""      # scoped PAT for your dev identity (PRs via gh) -> $GH_TOKEN
  gitea_token: ""       # scoped PAT for your dev identity on a self-hosted Gitea

# --- Comms: BBS + Usenet (try-it-out) ------------------------------------------
# Public servers you provide. The role installs clients and drops a launcher per
# entry — `bbs-<name>` and `news-<name>` on the deck's PATH. All public, no secrets.
comms:
  bbs:
    - { name: example, host: "bbs.example.org", port: 23 }      # telnet BBS
  usenet:
    - { name: example, server: "news.example.org", port: 119 }

# --- Tailscale next-hop (reach the homelab from anywhere) ----------------------
# The deck joins your tailnet so it can reach the homelab over a phone hotspot or
# your own WiFi. The auth key is a SECRET — provision-time only, gitignored, never
# in the repo. Use a TAGGED key so your tailnet ACLs scope what the deck may reach,
# and revoke the node from the admin console if the deck is lost.
tailscale:
  auth_key: ""                 # tskey-... — empty => skip the role entirely
  hostname: "cyberdeck"
  tags: ["tag:cyberdeck"]
  autoconnect: true            # false => installed but not up on boot (manual `tailscale up`)

# --- Lock: don't leave an unattended deck unlocked ---------------------------
# A lost-but-unlocked deck (live tailnet + SSH key) is the real exposure. All
# console-scoped: SSH sessions are unaffected. Minutes; 0 = off. Omit to keep defaults.
lock:
  blank_min: 5                 # console goes dark
  idle_logout_min: 15          # bare tty shell logs out (not in tmux, not over SSH)
  tmux_lock_min: 15            # tmux locks with vlock — your panes keep running
  allow_autologin: false       # true keeps a console autologin (defeats the logout)


# --- YOUR SECTIONS: everything else you install --------------------------------
# A section is a group you name; each name is also an Ansible tag
# (`ansible-playbook site.yml -K --tags games`). List them here — they install in
# this order, after the core system:
sections:
  - workstation
  - dotfiles
  - games

# Every section uses the same four keys, all optional, run in this order:
#   apt        system packages
#   pip        libs for the default python env (needs the python block above)
#   git        repos to clone, each with ordered `install` commands
#   downloads  pinned files (url + sha256), each with ordered `install` commands
# `install` runs as you in a login shell, top to bottom, stopping at the first
# failure (like &&) — only when the commit / sha256 / commands changed.
# Lists: one item per line so each can carry a comment; leave a key out when empty.
# Full guide: docs/software.md

workstation:
  apt:
    - mc                    # midnight commander
    - fastfetch             # system info (modern neofetch)
  downloads:
    - name: aichat
      url: "https://github.com/sigoden/aichat/releases/download/v0.30.0/aichat-v0.30.0-aarch64-unknown-linux-musl.tar.gz"
      sha256: "eb1cd0948569404c5d9d01c10b32b902e11f8231073315456454dec246bdf26e"
      install:
        - tar -xzf "$FILE" -C ~/.local/bin aichat
      entrypoint: aichat
      description: "All-in-one LLM CLI — chat, REPL, shell assistant"

# Your shell config: clone the PUBLIC dotfiles repo and stow its packages.
dotfiles:
  apt:
    - tealdeer              # tldr (configured by the tealdeer stow package)
  git:
    - name: dotfiles-public
      repo: "https://github.com/you/dotfiles.git"
      dest: ~/dotfiles-public
      install:
        - stow --restow zsh tmux bin tealdeer
      description: "Shell config: zsh, tmux, narrow, tldr"

games:
  apt:
    - chocolate-doom
  git:
    - name: doom-kit        # your own repo: WADs + config + install.sh
      repo: "git@git.example.com:you/doom-kit.git"
      version: v1           # branch, tag, or commit SHA
      install:
        - ./install.sh      # no sudo in here — system packages go in apt above
      entrypoint: doom
