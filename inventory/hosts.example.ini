# Copy to inventory/hosts.ini and edit. hosts.ini is gitignored.
#
#   cp inventory/hosts.example.ini inventory/hosts.ini && $EDITOR inventory/hosts.ini
#
# A cyberdeck is usually off and moves between networks, so there is no stable
# fleet address — point ansible_host at wherever the device is right now (an IP,
# an mDNS .local name, or a WireGuard address once that increment lands).
# ansible_user must match device_user in config.yml.

[cyberdeck]
deck ansible_host=CHANGE_ME ansible_user=deck

[cyberdeck:vars]
ansible_python_interpreter=/usr/bin/python3
